name: check

on:
  push:
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check host module syntax
        run: node --check lib/index.js
      - name: Validate manifests and defaults
        run: |
          node -e "for (const f of ['package.json','defaults/.dshw-size.json','defaults/.dshw-bubble.json','defaults/whale-roles/roles.json','defaults/whale-audio/audio.json','defaults/whale-bubble-imgs/bubble-imgs.json']) JSON.parse(require('fs').readFileSync(f,'utf8')); console.log('json ok')"
      - name: Check package manifest is a DSH bundle
        run: node -e "const p=require('./package.json'); if(!p.dsh?.bundle?.patch) throw new Error('missing dsh.bundle.patch'); console.log(p.name,p.version)"
